name: Spirit Launcher Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Apply Spirit patch
        run: |
          if [ -f spirit_patch.zip ]; then unzip -o spirit_patch.zip; fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get LTW
        run: |
          cd app_pojavlauncher/libs
          wget -q https://github.com/PojavLauncherTeam/LTW/releases/download/7703f1c/ltw-release.aar

      - name: Get Java runtimes from the official release APK
        run: |
          wget -q -O /tmp/pojav.apk https://github.com/PojavLauncherTeam/PojavLauncher/releases/download/gladiolus/PojavLauncher.apk
          mkdir /tmp/apk
          unzip -q /tmp/pojav.apk 'assets/components/jre/*' 'assets/components/jre-new/*' 'assets/components/jre-21/*' -d /tmp/apk
          cp -r /tmp/apk/assets/components/jre app_pojavlauncher/src/main/assets/components/
          cp -r /tmp/apk/assets/components/jre-new app_pojavlauncher/src/main/assets/components/
          cp -r /tmp/apk/assets/components/jre-21 app_pojavlauncher/src/main/assets/components/
          ls app_pojavlauncher/src/main/assets/components

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Build JRE JAR files
        run: |
          ./scripts/languagelist_updater.sh
          mkdir out
          gradle :jre_lwjgl3glfw:build --no-daemon

      - name: Build Debug APK
        run: |
          gradle :app_pojavlauncher:assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/SpiritLauncher.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpiritLauncher
          path: out/SpiritLauncher.apk
